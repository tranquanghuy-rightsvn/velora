<!-- Logged-in app shell. Only ever served through getAppHtml(token)/boot(token)
     after the token passes requireRole_ — never part of doGet()'s response. -->

<!-- ============ PRODUCTS LIST ============ -->
<main id="view-products" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 64px;">이미지</th>
            <th>상품명</th>
            <th style="width: 100px;">카테고리</th>
            <th style="width: 110px;">가격</th>
            <th style="width: 100px;">상태</th>
            <th style="width: 130px;">수정일</th>
            <th style="width: 150px;">작업</th>
          </tr>
        </thead>
        <tbody id="product-rows">
          <tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-secondary"></div><div class="muted mt-2">불러오는 중...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ============ PRODUCT EDITOR ============ -->
<main id="view-product-editor" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label" for="pr-name">상품명 *</label>
          <input type="text" class="form-control" id="pr-name" placeholder="예: LOVE 팔찌">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="pr-id">상품 ID (slug)</label>
          <input type="text" class="form-control" id="pr-id" placeholder="저장 시 자동 생성" disabled>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="pr-category">카테고리 *</label>
          <select class="form-select" id="pr-category">
            <option value="jewelry">주얼리 (jewelry)</option>
            <option value="watch">시계 (watch)</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="pr-price">가격 (KRW) *</label>
          <input type="number" class="form-control" id="pr-price" min="0" step="1000" placeholder="120000">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="pr-status">상태 *</label>
          <select class="form-select" id="pr-status">
            <option value="draft">임시저장 (사이트에 노출 안 됨)</option>
            <option value="published">판매중 (사이트에 노출)</option>
            <option value="sold">품절 (사이트에서 숨김)</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">상품 이미지</label>
          <div id="product-image-grid" class="gallery-grid"></div>
          <div class="d-flex align-items-center gap-3 mt-2">
            <input type="file" id="pr-images" class="form-control" style="max-width: 320px;" accept="image/*" multiple>
            <span id="product-image-status" class="muted"></span>
          </div>
          <small class="muted">첫 번째 이미지가 대표 이미지로 사용됩니다.</small>
        </div>
        <div class="col-12">
          <label class="form-label">상품 설명</label>
          <textarea id="product-content-editor"></textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3 align-items-center">
        <button class="btn btn-primary" id="btn-save-product" onclick="saveProductAction()"><i class="fa-solid fa-floppy-disk me-1"></i>저장</button>
        <button class="btn btn-outline-secondary" onclick="backToList()">취소</button>
        <span id="product-readonly-note" class="muted hidden"><i class="fa-solid fa-eye me-1"></i>조회 권한만 있습니다 (viewer).</span>
      </div>
    </div>
  </div>
</main>

<!-- ============ ORDERS LIST ============ -->
<main id="view-orders" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 130px;">주문번호</th>
            <th>고객명</th>
            <th>연락처</th>
            <th style="width: 110px;">금액</th>
            <th style="width: 110px;">결제상태</th>
            <th style="width: 110px;">주문상태</th>
            <th style="width: 120px;">주문일</th>
            <th style="width: 150px;">작업</th>
          </tr>
        </thead>
        <tbody id="order-rows">
          <tr><td colspan="8" class="text-center py-5"><div class="spinner-border text-secondary"></div><div class="muted mt-2">불러오는 중...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ============ ORDER EDITOR ============ -->
<main id="view-order-editor" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="or-customer-name">고객명 *</label>
          <input type="text" class="form-control" id="or-customer-name">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="or-customer-phone">연락처</label>
          <input type="text" class="form-control" id="or-customer-phone" placeholder="010-0000-0000">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="or-customer-email">이메일</label>
          <input type="email" class="form-control" id="or-customer-email" placeholder="customer@example.com">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="or-customer-instagram">인스타그램</label>
          <input type="text" class="form-control" id="or-customer-instagram" placeholder="@velo.rajwlry">
        </div>
        <div class="col-12">
          <label class="form-label" for="or-address">배송지</label>
          <input type="text" class="form-control" id="or-address">
        </div>

        <div class="col-12">
          <label class="form-label">주문 상품 *</label>
          <div id="order-items"></div>
          <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="addOrderItemRow()"><i class="fa-solid fa-plus me-1"></i>상품 추가</button>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="or-discount">할인 금액</label>
          <input type="number" class="form-control" id="or-discount" min="0" step="1000" value="0" oninput="recalcOrderTotal()">
        </div>
        <div class="col-md-3">
          <label class="form-label">합계</label>
          <input type="text" class="form-control" id="or-total" disabled>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="or-payment-method">결제수단</label>
          <select class="form-select" id="or-payment-method">
            <option value="카카오페이">카카오페이</option>
            <option value="네이버페이">네이버페이</option>
            <option value="계좌이체">계좌이체</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="or-payment-status">결제상태</label>
          <select class="form-select" id="or-payment-status">
            <option value="미결제">미결제</option>
            <option value="입금확인중">입금확인중</option>
            <option value="입금완료">입금완료</option>
            <option value="환불">환불</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="or-status">주문상태</label>
          <select class="form-select" id="or-status">
            <option value="신규">신규</option>
            <option value="확인중">확인중</option>
            <option value="배송준비">배송준비</option>
            <option value="배송중">배송중</option>
            <option value="완료">완료</option>
            <option value="취소">취소</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="or-tracking">운송장번호</label>
          <input type="text" class="form-control" id="or-tracking">
        </div>
        <div class="col-12">
          <label class="form-label" for="or-note">메모</label>
          <textarea class="form-control" id="or-note" rows="2"></textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3 align-items-center">
        <button class="btn btn-primary" id="btn-save-order" onclick="saveOrderAction()"><i class="fa-solid fa-floppy-disk me-1"></i>저장</button>
        <button class="btn btn-outline-secondary" onclick="backToList()">취소</button>
        <span id="order-readonly-note" class="muted hidden"><i class="fa-solid fa-eye me-1"></i>조회 권한만 있습니다 (viewer).</span>
      </div>
    </div>
  </div>
</main>

<!-- ============ POSTS LIST ============ -->
<main id="view-posts" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width: 64px;">이미지</th>
            <th>제목</th>
            <th style="width: 100px;">상태</th>
            <th style="width: 120px;">발행일</th>
            <th style="width: 130px;">수정일</th>
            <th style="width: 150px;">작업</th>
          </tr>
        </thead>
        <tbody id="post-rows">
          <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-secondary"></div><div class="muted mt-2">불러오는 중...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ============ POST EDITOR ============ -->
<main id="view-post-editor" class="content-wrap hidden">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label" for="ps-title">제목 *</label>
          <input type="text" class="form-control" id="ps-title" placeholder="게시글 제목">
        </div>
        <div class="col-md-4">
          <label class="form-label" for="ps-id">게시글 ID (slug)</label>
          <input type="text" class="form-control" id="ps-id" placeholder="저장 시 자동 생성" disabled>
        </div>
        <div class="col-md-8">
          <label class="form-label" for="ps-excerpt">요약 (목록/SEO 설명에 사용)</label>
          <textarea class="form-control" id="ps-excerpt" rows="2"></textarea>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="ps-status">상태</label>
          <select class="form-select" id="ps-status">
            <option value="draft">임시저장</option>
            <option value="published">발행</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="ps-published-at">발행일</label>
          <input type="date" class="form-control" id="ps-published-at">
        </div>
        <div class="col-12">
          <label class="form-label">커버 이미지</label>
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <input type="file" id="ps-cover" class="form-control" style="max-width: 320px;" accept="image/*">
            <img id="post-cover-preview" class="cover-preview hidden" alt="cover">
            <span id="post-cover-status" class="muted"></span>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">본문</label>
          <textarea id="post-content-editor"></textarea>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3 align-items-center">
        <button class="btn btn-primary" id="btn-save-post" onclick="savePostAction()"><i class="fa-solid fa-floppy-disk me-1"></i>저장</button>
        <button class="btn btn-outline-secondary" onclick="backToList()">취소</button>
        <span id="post-readonly-note" class="muted hidden"><i class="fa-solid fa-eye me-1"></i>조회 권한만 있습니다 (viewer).</span>
      </div>
    </div>
  </div>
</main>

<!-- ============ USERS (root only) ============ -->
<main id="view-users" class="content-wrap hidden">
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <h6 class="mb-3"><i class="fa-solid fa-user-plus me-2"></i>계정 추가</h6>
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label" for="us-email">이메일</label>
          <input type="text" class="form-control" id="us-email" placeholder="staff@example.com">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="us-role">권한</label>
          <select class="form-select" id="us-role">
            <option value="editor">editor (등록/수정 가능)</option>
            <option value="viewer">viewer (조회만 가능)</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="addUserAction()"><i class="fa-solid fa-plus me-1"></i>추가</button>
        </div>
      </div>
      <small class="muted d-block mt-2">스크립트 소유자(<b>root</b>)는 시스템 레벨에서 결정되며 여기서 추가/수정할 수 없습니다.</small>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>이메일</th>
            <th style="width: 200px;">권한</th>
            <th style="width: 130px;">등록일</th>
            <th style="width: 100px;">작업</th>
          </tr>
        </thead>
        <tbody id="user-rows">
          <tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-secondary"></div><div class="muted mt-2">불러오는 중...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
