<style>
  body { background: #f5f6f8; }
  .hidden { display: none !important; }

  body.login-mode { background: #fff; }
  body.login-mode .sidebar,
  body.login-mode .topbar { display: none !important; }
  body.login-mode #view-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .muted { color: #6b7280; font-size: 12px; }
  code { background: #eef1f5; padding: 1px 4px; border-radius: 3px; color: #374151; }

  .app { min-height: 100vh; }

  .sidebar { width: 240px; flex-shrink: 0; background: #111827; min-height: 100vh; position: sticky; top: 0; }
  .sidebar .brand { color: #fff; font-weight: 700; font-size: 16px; padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap; }
  .sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #9ca3af; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  .sidebar nav a:hover { color: #fff; }
  .sidebar nav a.active { background: #1f2937; color: #fff; border-left-color: #3b82f6; }
  .sidebar nav a i { width: 18px; text-align: center; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .topbar strong { font-size: 16px; }
  .user-badge { margin-left: auto; color: #6b7280; font-size: 13px; }
  .user-badge b { color: #111827; text-transform: uppercase; }
  .content-wrap { padding: 24px; }

  .cover-preview { max-height: 100px; border-radius: 6px; border: 1px solid #e5e7eb; }

  .gallery-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .gallery-item { position: relative; width: 120px; height: 90px; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; background: #f3f4f6; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .gallery-remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(17,24,39,.75); color: #fff; font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .gallery-item .gallery-remove:hover { background: #dc2626; }
  .gallery-item .gallery-uploading { position: absolute; inset: 0; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; }
  .gallery-item .gallery-badge { position: absolute; left: 4px; bottom: 4px; background: rgba(17,24,39,.75); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 4px; }
  .gallery-item .gallery-badge--pending { left: auto; right: 4px; background: #b45309; }
  .gallery-item .gallery-badge--error { left: auto; right: 4px; background: #dc2626; }
  .gallery-item.gallery-item--cover { border-color: #3b82f6; }

  .order-item-row { display: grid; grid-template-columns: 40px 1fr 140px 90px 28px 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .order-item-row input { min-width: 0; }
  .order-item-row__thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: #f3f4f6; border: 1px solid #e5e7eb; }
  .order-item-row__thumb--empty { display: block; }
  .order-item-row__link { display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 13px; }
  .order-item-row__link:hover { color: #2563eb; }

  .badge-status { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-status--neutral { background: #f3f4f6; color: #4b5563; }
  .badge-status--success { background: #dcfce7; color: #166534; }
  .badge-status--danger { background: #fee2e2; color: #991b1b; }
  .badge-status--warning { background: #fef3c7; color: #92400e; }
  .badge-status--info { background: #dbeafe; color: #1e40af; }

  .overlay { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 2000; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 4px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 14px; z-index: 3000; }
  .toast-msg.error { background: #b91c1c; }

  @media (max-width: 768px) {
    .sidebar { width: 64px; }
    .sidebar .brand { font-size: 0; padding: 18px 0; text-align: center; }
    .sidebar .brand i { font-size: 18px; margin: 0 !important; }
    .sidebar nav a { justify-content: center; font-size: 0; gap: 0; }
    .sidebar nav a i { font-size: 16px; }
    .order-item-row { grid-template-columns: 1fr; }
  }
</style>
