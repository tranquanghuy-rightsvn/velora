<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장바구니 — Velora Jewelry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="inner-page">

  <nav class="breadcrumb">
    <a href="/">홈</a>
    <span class="breadcrumb__sep">/</span>
    <span>장바구니</span>
  </nav>

  <div class="cart-page" id="main-content">
    <h1 class="cart-page__title">장바구니</h1>

    <div class="cart-items" id="cartItems" style="display:none;"></div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="cart-summary__row">
        <span class="cart-summary__label">총 금액</span>
        <span class="cart-summary__total-value">₩0</span>
      </div>
      <div id="paypalButtonContainer"></div>
      <p class="cart-summary__pay-error" id="paypalError" style="display:none;"></p>
    </div>

    <div class="cart-empty-state">
      <p class="cart-empty-state__msg">장바구니가 비어있습니다</p>
      <a href="/" class="cart-empty-state__link">쇼핑 계속하기</a>
    </div>

    <div class="cart-success-state" id="cartSuccessState" style="display:none;">
      <svg class="cart-success-state__icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>
      <p class="cart-success-state__msg">결제가 완료되었습니다</p>
      <p class="cart-success-state__order" id="cartSuccessOrderId"></p>
      <a href="/" class="cart-empty-state__link">쇼핑 계속하기</a>
    </div>

    <div class="cart-login-prompt">
      <h3 class="cart-login-prompt__heading">계정이 있으신가요?</h3>
      <p class="cart-login-prompt__sub">
        <a href="/account/">로그인하여</a> 더 빠르게 결제하세요
      </p>
    </div>
  </div>

  <script src="/shared.js"></script>
  <script src="/wishlist.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=BAAWN59ws8UKcTrXNK-TvQ5cpw9bBfHSw7ELYS-7Dz8lGCryz4cKQfEYPnO1bKqxqCc8qUOVtdgOVtKlIU&currency=KRW&intent=capture&components=buttons"></script>
  <script src="/cart.js"></script>
</body>
</html>
