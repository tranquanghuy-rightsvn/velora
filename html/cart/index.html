<body class="inner-page">

  <nav class="breadcrumb">
    <a href="/">홈</a>
    <span class="breadcrumb__sep">/</span>
    <span>장바구니</span>
  </nav>

  <div class="cart-page" id="main-content">
    <h1 class="cart-page__title">장바구니</h1>

    <div class="cart-items" id="cartItems" style="display:none;"></div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="cart-summary__row">
        <span class="cart-summary__label">총 금액</span>
        <span class="cart-summary__total-value">₩0</span>
      </div>
      <div class="cart-payment">
        <p class="cart-payment__title">결제 방법 선택</p>

        <div class="cart-payment__option">
          <div class="cart-payment__option-head">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            <span class="cart-payment__option-label">인스타그램 DM 문의</span>
          </div>
          <p class="cart-payment__option-desc">주문 내역 확인 후 DM으로 결제를 안내해 드립니다.</p>
          <a href="https://www.instagram.com/velo.rajwlry" target="_blank" rel="noopener" class="cart-payment__cta cart-payment__cta--primary">@velo.rajwlry DM 보내기</a>
        </div>

        <div class="cart-payment__option">
          <div class="cart-payment__option-head">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
            <span class="cart-payment__option-label">계좌 이체</span>
          </div>
          <p class="cart-payment__option-desc">아래 계좌로 입금 후 주문을 확정해 주세요.</p>
          <div class="cart-payment__bank">
            <div class="contact-block">
              <div class="contact-block__label">은행명</div>
              <div class="contact-block__value">우리은행 (WOORI BANK)</div>
            </div>
            <div class="contact-block">
              <div class="contact-block__label">계좌번호</div>
              <div class="contact-block__value cart-payment__account-row">
                <span id="bankAccountNumber">1002846822135</span>
                <button type="button" class="cart-payment__copy-btn" id="copyAccountBtn" aria-label="계좌번호 복사">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                  복사
                </button>
              </div>
            </div>
            <div class="contact-block">
              <div class="contact-block__label">예금주</div>
              <div class="contact-block__value">박용진</div>
            </div>
          </div>
          <button type="button" class="cart-payment__cta cart-payment__cta--outline" id="confirmBankTransferBtn">이체 완료, 주문 확정</button>
        </div>
      </div>
      <p class="cart-summary__pay-error" id="cartPaymentError" style="display:none;"></p>
    </div>

    <div class="cart-empty-state">
      <p class="cart-empty-state__msg">장바구니가 비어있습니다</p>
      <a href="/" class="cart-empty-state__link">쇼핑 계속하기</a>
    </div>

    <div class="cart-success-state" id="cartSuccessState" style="display:none;">
      <svg class="cart-success-state__icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>
      <p class="cart-success-state__msg">주문이 접수되었습니다</p>
      <p class="cart-success-state__sub">입금 확인 후 인스타그램 DM으로 안내드립니다.</p>
      <p class="cart-success-state__order" id="cartSuccessOrderId"></p>
      <a href="/" class="cart-empty-state__link">쇼핑 계속하기</a>
    </div>

    <div class="cart-login-prompt">
      <h3 class="cart-login-prompt__heading">계정이 있으신가요?</h3>
      <p class="cart-login-prompt__sub">
        <a href="/account/">로그인하여</a> 더 빠르게 결제하세요
      </p>
    </div>
  </div>
