<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — Velora Jewelry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="inner-page">

  <div class="account-page">
    <div class="account-box">
      <div class="account-box__logo">
        <span class="brand-wordmark">VELORA JEWELRY</span>
      </div>

      <h1 class="account-box__title">로그인</h1>
      <p class="account-box__sub">로그인하거나 계정 생성</p>

      <button class="account-shop-btn">
        <svg width="18" height="18" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="6" fill="#5433EB"/>
          <path d="M9 18.5L15 24.5L27 12.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        shop(으)로 계속
      </button>

      <div class="account-divider">또는</div>

      <form onsubmit="return false;">
        <div class="account-email-row">
          <input type="email" class="account-email-input" placeholder="이메일 주소" />
          <button type="submit" class="account-email-btn" aria-label="계속">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <label class="account-checkbox">
          <input type="checkbox" />
          뉴스 및 제안을 이메일로 받기
        </label>
      </form>

      <p class="account-privacy">
        가입하면 <a href="#">개인정보처리방침</a>에 동의하는 것입니다.
      </p>
    </div>
  </div>

  <script src="shared.js"></script>
</body>
</html>
