<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 — Velora Jewelry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="inner-page">

  <nav class="breadcrumb">
    <a href="index.html">홈</a>
    <span class="breadcrumb__sep">/</span>
    <span>문의하기</span>
  </nav>

  <div class="contact-layout" id="main-content">
    <div class="contact-info">
      <h1 class="contact-info__title">문의하기</h1>
      <p class="contact-info__desc">제품 사이즈, 컨디션, 가격이 궁금하시다면 인스타그램 DM으로 편하게 문의해 주세요. 최대한 빠르게 답변 드리겠습니다.</p>

      <div class="contact-block">
        <div class="contact-block__label">인스타그램 DM</div>
        <div class="contact-block__value">
          <a href="https://www.instagram.com/velo.rajwlry" target="_blank" rel="noopener">@velo.rajwlry</a>
        </div>
      </div>
      <div class="contact-block">
        <div class="contact-block__label">주문 방식</div>
        <div class="contact-block__value">관심 있는 제품의 인스타그램 DM 또는 아래 문의 양식으로 연락 주시면, 실사진·사이즈·가격을 안내해 드립니다.</div>
      </div>
      <div class="contact-block">
        <div class="contact-block__label">응답 시간</div>
        <div class="contact-block__value">평균 24시간 이내 답변드립니다.</div>
      </div>
    </div>

    <div class="contact-form">
      <h2 class="contact-form__title">메시지 보내기</h2>
      <form onsubmit="return false;">
        <div class="form-field">
          <label for="contact-name">이름</label>
          <input type="text" id="contact-name" placeholder="홍길동" />
        </div>
        <div class="form-field">
          <label for="contact-email">이메일</label>
          <input type="email" id="contact-email" placeholder="your@email.com" />
        </div>
        <div class="form-field">
          <label for="contact-message">메시지</label>
          <textarea id="contact-message" placeholder="문의하실 제품명과 궁금하신 점을 남겨주세요..."></textarea>
        </div>
        <button type="submit" class="form-submit">보내기</button>
      </form>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="wishlist.js"></script>
  <script src="cart.js"></script>
</body>
</html>
